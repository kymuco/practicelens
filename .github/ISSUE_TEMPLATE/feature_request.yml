name: Feature request
description: Suggest an improvement or new capability for PracticeLens.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the pain point first.
      placeholder: I want to compare several takes more clearly, but...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or capability you want.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Mention what should stay unchanged, if relevant.
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts or interfaces affected
      description: CLI, API, report fields, SVG/CSV output, docs, or something else.
