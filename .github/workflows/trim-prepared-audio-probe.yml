name: trim-prepared-audio-probe

on:
  pull_request:

jobs:
  probe:
    if: github.head_ref == 'r0-5a-recording-start-equivalence-repair-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Compare prepared-audio equivalence
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from practicelens.domain.models import AnalysisConfig
          from practicelens.io import ensure_finite_audio, load_wav_audio
          from practicelens.io.models import LoadedAudio
          from practicelens.measurement.controlled_perturbations import generate_controlled_perturbation_harness
          from practicelens.measurement.equivalence_floor import generate_equivalent_recording_cases
          from practicelens.preprocessing import peak_normalize, remove_dc_offset, resample_linear, trim_silence
          from practicelens.preprocessing.trim import trim_silence_fixed_padding

          config = AnalysisConfig(target_sample_rate=16000, frame_length=1024, hop_length=256, segment_duration_s=1.0)

          def common(audio):
              audio = ensure_finite_audio(audio)
              samples = audio.samples
              if audio.sample_rate != config.target_sample_rate:
                  samples = resample_linear(samples, audio.sample_rate, config.target_sample_rate)
              samples = remove_dc_offset(samples)
              return peak_normalize(samples)

          def old(samples):
              return trim_silence(samples, threshold=0.01, pad_samples=64)
          def nopad(samples):
              return trim_silence(samples, threshold=0.01, pad_samples=0)
          def fixed9(samples):
              return trim_silence_fixed_padding(samples, threshold=0.01, pad_samples=9)
          def weak(samples, threshold):
              values=tuple(samples)
              start=0; end=len(values)
              while start<end and abs(values[start])<threshold: start += 1
              while end>start and abs(values[end-1])<threshold: end -= 1
              return values[start:end]

          strategies = {
              "old_clip64": old,
              "exact_no_pad": nopad,
              "fixed_context9": fixed9,
              "weak_1e-3": lambda s: weak(s, 0.001),
              "weak_1e-4": lambda s: weak(s, 0.0001),
          }

          def compare(a,b):
              n=min(len(a),len(b))
              max_abs=max((abs(a[i]-b[i]) for i in range(n)), default=0.0)
              differing=sum(1 for i in range(n) if a[i] != b[i])
              return {"len_a":len(a),"len_b":len(b),"max_abs_common":max_abs,"differing_common":differing}

          with TemporaryDirectory() as td:
              root=Path(td)
              harness=generate_controlled_perturbation_harness(root/"r04",sample_rate=16000)
              gain=next(c for c in harness.cases if c.condition.condition_id=="amplitude_gain__12")
              eq_ref, eq_cases=generate_equivalent_recording_cases(root/"r05",sample_rate=16000)
              leading=next(c for c in eq_cases if c.case_id=="leading_silence_16ms")

              r04_base=common(load_wav_audio(harness.reference_path))
              r04_gain=common(load_wav_audio(gain.path))
              r05_base=common(load_wav_audio(eq_ref))
              r05_lead=common(load_wav_audio(leading.path))

              for name, strategy in strategies.items():
                  print(name)
                  print("  gain12_prepared:", compare(strategy(r04_base), strategy(r04_gain)))
                  print("  lead16_prepared:", compare(strategy(r05_base), strategy(r05_lead)))
          PY
