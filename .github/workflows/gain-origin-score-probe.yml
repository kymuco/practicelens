name: gain-origin-score-probe

on:
  pull_request:

jobs:
  probe:
    if: github.head_ref == 'r0-5a-recording-start-equivalence-repair-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Compare gain score by origin
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import MethodType

          from practicelens.application import AnalyzeRequest, OfflineReferenceAnalysisPipeline
          from practicelens.domain.models import AnalysisConfig
          from practicelens.io import ensure_finite_audio, load_wav_audio
          from practicelens.io.models import LoadedAudio
          from practicelens.measurement.controlled_perturbations import generate_controlled_perturbation_harness
          from practicelens.preprocessing import peak_normalize, remove_dc_offset, resample_linear, trim_silence
          from practicelens.preprocessing.trim import trim_silence_fixed_padding

          config=AnalysisConfig(target_sample_rate=16000,frame_length=1024,hop_length=256,segment_duration_s=1.0)
          metrics=("pitch_fidelity","rhythm_fidelity","timing_consistency","section_stability")

          def common(audio):
              audio=ensure_finite_audio(audio)
              samples=audio.samples
              if audio.sample_rate != config.target_sample_rate:
                  samples=resample_linear(samples,audio.sample_rate,config.target_sample_rate)
              samples=remove_dc_offset(samples)
              samples=peak_normalize(samples)
              return samples,audio

          def wrapped(fn):
              def prepare(self,audio,cfg):
                  samples,source=common(audio)
                  out=fn(samples)
                  return LoadedAudio(
                      samples=tuple(out or samples),
                      sample_rate=cfg.target_sample_rate,
                      source_channels=source.source_channels,
                      sample_width_bytes=source.sample_width_bytes,
                  )
              return prepare

          def weak(threshold):
              def f(samples):
                  values=tuple(samples); start=0; end=len(values)
                  while start<end and abs(values[start])<threshold: start+=1
                  while end>start and abs(values[end-1])<threshold: end-=1
                  return values[start:end]
              return f

          strategies={
              "exact_no_pad": lambda s: trim_silence(s,threshold=.01,pad_samples=0),
              "fixed_context9": lambda s: trim_silence_fixed_padding(s,threshold=.01,pad_samples=9),
              "weak_1e-3": weak(.001),
              "weak_1e-4": weak(.0001),
          }

          with TemporaryDirectory() as td:
              root=Path(td)
              harness=generate_controlled_perturbation_harness(root/"h",sample_rate=16000)
              gain=next(c for c in harness.cases if c.condition.condition_id=="amplitude_gain__12")
              for name,fn in strategies.items():
                  pipe=OfflineReferenceAnalysisPipeline()
                  pipe._prepare_audio=MethodType(wrapped(fn),pipe)
                  ref=pipe.analyze(AnalyzeRequest(reference_path=harness.reference_path,take_path=harness.reference_path,config=config)).report.score_map()
                  take=pipe.analyze(AnalyzeRequest(reference_path=harness.reference_path,take_path=gain.path,config=config)).report.score_map()
                  print(name,{m:take[m].score-ref[m].score for m in metrics})
          PY
