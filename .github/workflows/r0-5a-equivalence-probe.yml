name: r0-5a-equivalence-probe

on:
  pull_request:

jobs:
  equivalence:
    if: github.head_ref == 'r0-5a-synthetic-equivalence-floor-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run frozen R0.5a equivalence experiment
        env:
          PRACTICELENS_INSTRUMENT_REVISION: b2369e07df8ad36046ad337db2327656483b6397
        run: |
          python tools/run_synthetic_equivalence_floor.py
          cat out/synthetic_equivalence_floor_v1/summary.json
