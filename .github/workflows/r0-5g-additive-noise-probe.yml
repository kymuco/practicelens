name: r0-5g-additive-noise-probe

on:
  pull_request:

jobs:
  attribution:
    if: github.head_ref == 'r0-5g-additive-noise-attribution-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run R0.5g additive-noise attribution
        env:
          PRACTICELENS_INSTRUMENT_REVISION: 4b979d01256598657f19a1cb97ae86dc66470e9b
        run: |
          python tools/run_additive_noise_attribution.py
          cat out/additive_noise_attribution_v1/summary.json
