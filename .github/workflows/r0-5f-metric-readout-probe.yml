name: r0-5f-metric-readout-probe

on:
  pull_request:

jobs:
  readout:
    if: github.head_ref == 'r0-5f-metric-specific-alignment-readout-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run R0.5f metric-specific readout ablation
        env:
          PRACTICELENS_INSTRUMENT_REVISION: 352e89ec8b0cc4bfb7ff020c44b523c94fe8f712
        run: |
          python tools/run_metric_specific_alignment_readout.py
          cat out/metric_specific_alignment_readout_v1/summary.json
