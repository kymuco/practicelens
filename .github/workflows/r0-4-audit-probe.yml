name: r0-4-audit-probe

on:
  pull_request:

jobs:
  audit:
    if: github.head_ref == 'r0-4-baseline-measurement-validity-audit-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run frozen R0.4 audit
        env:
          PRACTICELENS_INSTRUMENT_REVISION: 1cb1a6d92ada295b989cf41c26c32a434f82a510
        run: |
          python tools/run_measurement_validity_audit.py
          cat out/measurement_validity_audit_v1/summary.json
