[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "practicelens"
version = "0.1.0a0"
description = "Reference-aware audio practice analysis for singing and instrument takes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Kymuco" }
]
keywords = [
  "audio",
  "audio-analysis",
  "music-analysis",
  "signal-processing",
  "practice",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
practicelens = "practicelens.cli.main:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/practicelens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
